name: brawl_stars_costume_maker
description: Brawl Stars için mobil kostüm tasarımcı ve kombinasyon uygulaması.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.0.0
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.1
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  get: ^4.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_linter: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
